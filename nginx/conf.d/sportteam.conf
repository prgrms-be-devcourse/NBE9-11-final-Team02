server {
    listen 80;

    # Docker 내장 DNS. upstream을 변수로 두면 nginx가 설정 로드 시점이 아니라
    # 요청 시점에 이름을 해석한다 → 컨테이너가 잠깐 없어도 reload 실패 없이 기동.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 블루-그린 전환 지점: CD가 이 한 줄($backend)만 활성 컨테이너로 교체한다.
    set $backend  app1_1:8090;
    set $frontend frontend_1:3000;

    client_max_body_size 20m;

    # 백엔드 API
    location /api/ {
        proxy_pass http://$backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket (STOMP/SockJS)
    location /ws/ {
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # Swagger (운영 데모용)
    location /swagger-ui/ {
        proxy_pass http://$backend;
        proxy_set_header Host $host;
    }
    location /v3/api-docs {
        proxy_pass http://$backend;
        proxy_set_header Host $host;
    }

    # 프론트엔드(Next.js). 별도 CD로 배포되어 부재 가능 → 변수+resolver로 지연 해석.
    location / {
        proxy_pass http://$frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
