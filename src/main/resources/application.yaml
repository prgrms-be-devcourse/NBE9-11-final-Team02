server:
  port: 8090
  forward-headers-strategy: native

spring:
  application:
    name: NBE9-11-final-Team02
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: ${KAFKA_NOTIFICATION_GROUP_ID:sportteam-notification}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
      auto-startup: ${KAFKA_LISTENER_AUTO_STARTUP:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}

app:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-key-in-production}
    access-token-validity-seconds: ${JWT_ACCESS_TOKEN_VALIDITY_SECONDS:1800}
    refresh-token-validity-seconds: ${JWT_REFRESH_TOKEN_VALIDITY_SECONDS:1209600}
    access-token-cookie-name: ${JWT_ACCESS_COOKIE_NAME:accessToken}
    refresh-token-cookie-name: ${JWT_REFRESH_COOKIE_NAME:refreshToken}
    secure-cookie: ${JWT_SECURE_COOKIE:false}
    same-site: ${JWT_COOKIE_SAME_SITE:Lax}
  payment:
    toss:
      base-url: ${TOSS_PAYMENTS_BASE_URL:https://api.tosspayments.com}
      secret-key: ${TOSS_PAYMENTS_SECRET_KEY:}
  scheduler:
    notification:
      fixed-delay-ms: ${NOTIFICATION_FIXED_DELAY_MS:60000}
      reminder-before-minutes: ${NOTIFICATION_REMINDER_BEFORE_MINUTES:60}
      reminder-window-minutes: ${NOTIFICATION_REMINDER_WINDOW_MINUTES:1}
    match-deadline:
      fixed-delay-ms: ${MATCH_DEADLINE_FIXED_DELAY_MS:60000}
      batch-size: ${MATCH_DEADLINE_BATCH_SIZE:100}
    refund:
      fixed-delay-ms: ${REFUND_FIXED_DELAY_MS:60000}
      batch-size: ${REFUND_BATCH_SIZE:50}
    match-completion:
      fixed-delay-ms: ${MATCH_COMPLETION_FIXED_DELAY_MS:600000}
      batch-size: ${MATCH_COMPLETION_BATCH_SIZE:100}
  queue:
    reservation:
      token-ttl-seconds: ${RESERVATION_QUEUE_TOKEN_TTL_SECONDS:300}
      entry-limit: ${RESERVATION_QUEUE_ENTRY_LIMIT:1}
  notification:
    kafka:
      topic:
        match: ${NOTIFICATION_MATCH_TOPIC:notification.match}
  settlement:
    platform-fee-rate: ${PLATFORM_FEE_RATE:0.07}

match:
  payment-hold:
    duration-minutes: 10
    expiration-check-delay-millis: 60000

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
  profiles:
    active: dev
    include: secret
  config:
    import: optional:file:/app/application-secret.yaml
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always
