spring:
  datasource:
    url: jdbc:mysql://mysql_1:3306/team02_prod?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&rewriteBatchedStatements=true
    username: team02
    password: "${custom.prod.db.password}"
  data:
    redis:
      host: redis_1
      port: 6379
      password: "${custom.prod.redis.password}"
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

logging:
  level:
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
    org.hibernate.orm.jdbc.extract: WARN
    org.springframework.transaction.interceptor: WARN
    com.back: INFO

app:
  payment:
    toss:
      secret-key: "${custom.prod.toss.secretKey}"

match:
  payment-hold:
    duration-minutes: 10
    expiration-check-delay-millis: 60000
