services:
  nginx:
    image: nginx:1.30
    container_name: nginx_1
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - /home/ec2-user/nginx/conf.d:/etc/nginx/conf.d:ro
    networks:
      - common

  mysql:
    image: mysql:8.4
    container_name: mysql_1
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-}
      MYSQL_DATABASE: team02_prod
      TZ: Asia/Seoul
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - common

  redis:
    image: redis:7.4
    container_name: redis_1
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-}
    environment:
      TZ: Asia/Seoul
    networks:
      - common

  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka_1
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka_1:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka_1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      TZ: Asia/Seoul
    networks:
      - common
  app1_1:
    image: ${APP_IMAGE:-ghcr.io/prgrms-be-devcourse/nbe9-11-team02:latest}
    container_name: app1_1
    restart: unless-stopped
    networks:
      - common
    environment:
      TZ: Asia/Seoul
      SPRING_CONFIG_IMPORT: optional:file:/app/application-secret.yaml
      SPRING_PROFILES_ACTIVE: prod
      KAFKA_BOOTSTRAP_SERVERS: kafka_1:9092
    volumes:
      - /home/ec2-user/secrets/application-secret.yaml:/app/application-secret.yaml:ro
    mem_limit: 600m
    profiles:
      - prod

  app1_2:
    image: ${APP_IMAGE:-ghcr.io/prgrms-be-devcourse/nbe9-11-team02:latest}
    container_name: app1_2
    restart: unless-stopped
    networks:
      - common
    environment:
      TZ: Asia/Seoul
      SPRING_CONFIG_IMPORT: optional:file:/app/application-secret.yaml
      SPRING_PROFILES_ACTIVE: prod
      KAFKA_BOOTSTRAP_SERVERS: kafka_1:9092
    volumes:
      - /home/ec2-user/secrets/application-secret.yaml:/app/application-secret.yaml:ro
    mem_limit: 600m
    profiles:
      - prod

networks:
  common:
    name: common
    external: true

volumes:
  mysql_data:
