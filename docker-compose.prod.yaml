services:
  nginx:
    image: nginx:1.30
    container_name: nginx_1
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - /home/ec2-user/nginx/conf.d:/etc/nginx/conf.d:ro
    networks:
      - common

  mysql:
    image: mysql:8.4
    container_name: mysql_1
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-}
      MYSQL_DATABASE: team02_prod
      MYSQL_USER: team02
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-}
      TZ: Asia/Seoul
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - common

  redis:
    image: redis:7.4
    container_name: redis_1
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-}
    environment:
      TZ: Asia/Seoul
    networks:
      - common

  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka_1
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka_1:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka_1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      TZ: Asia/Seoul
    networks:
      - common
  app1_1:
    image: ${APP_IMAGE:-ghcr.io/prgrms-be-devcourse/nbe9-11-team02:latest}
    container_name: app1_1
    restart: unless-stopped
    networks:
      - common
    environment:
      TZ: Asia/Seoul
      SPRING_CONFIG_IMPORT: optional:file:/app/application-secret.yaml
      SPRING_PROFILES_ACTIVE: prod
      KAFKA_BOOTSTRAP_SERVERS: kafka_1:9092
      LOGGING_FILE_NAME: /app/logs/app1_1.log
    volumes:
      - /home/ec2-user/secrets/application-secret.yaml:/app/application-secret.yaml:ro
      - ./logs:/app/logs
    mem_limit: 600m
    profiles:
      - prod

  app1_2:
    image: ${APP_IMAGE:-ghcr.io/prgrms-be-devcourse/nbe9-11-team02:latest}
    container_name: app1_2
    restart: unless-stopped
    networks:
      - common
    environment:
      TZ: Asia/Seoul
      SPRING_CONFIG_IMPORT: optional:file:/app/application-secret.yaml
      SPRING_PROFILES_ACTIVE: prod
      KAFKA_BOOTSTRAP_SERVERS: kafka_1:9092
      LOGGING_FILE_NAME: /app/logs/app1_2.log
    volumes:
      - /home/ec2-user/secrets/application-secret.yaml:/app/application-secret.yaml:ro
      - ./logs:/app/logs
    mem_limit: 600m
    profiles:
      - prod

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/prgrms-be-devcourse/nbe9-11-team02-frontend:latest}
    container_name: frontend_1
    restart: unless-stopped
    networks:
      - common
    environment:
      TZ: Asia/Seoul
      # 블루-그린 전환을 nginx 한 곳에서만 관리하도록 백엔드 호출을 nginx 경유로 보낸다.
      BACKEND_API_URL: http://nginx_1
    mem_limit: 300m
    profiles:
      - prod

  prometheus:
    image: prom/prometheus:v3.0.1
    container_name: prometheus_1
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: 256m
    networks:
      - common

  loki:
    image: grafana/loki:3.3.2
    container_name: loki_1
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    mem_limit: 256m
    networks:
      - common

  promtail:
    image: grafana/promtail:3.3.2
    container_name: promtail_1
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yml -config.expand-env=true
    environment:
      ENVIRONMENT: prod
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - ./logs:/var/log/sportteam:ro
    depends_on:
      - loki
    mem_limit: 128m
    networks:
      - common

  grafana:
    image: grafana/grafana:11.4.0
    container_name: grafana_1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      TZ: Asia/Seoul
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
    mem_limit: 256m
    networks:
      - common

networks:
  common:
    name: common
    external: true

volumes:
  mysql_data:
  prometheus_data:
  loki_data:
  grafana_data:
