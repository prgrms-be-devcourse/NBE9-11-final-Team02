name: CD

env:
  IMAGE_REPOSITORY: nbe9-11-team02
  CONTAINER_1_NAME: app1_1
  CONTAINER_2_NAME: app1_2
  CONTAINER_PORT: 8090
  EC2_INSTANCE_TAG_NAME: team02-web  # terraform/variables.tf의 prefix + "-web"과 일치해야 함
  DOCKER_NETWORK: common

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    paths:
      - ".github/workflows/**"
      - "src/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "Dockerfile"
    branches:
      - main
      - develop

defaults:
  run:
    shell: bash

jobs:
  calculateTag:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag_name: ${{ steps.dry_run.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: 다음 버전 태그 계산 (dry-run)
        id: dry_run
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          dry_run: true

  buildImageAndPush:
    name: 도커 이미지 빌드와 푸시
    needs: calculateTag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Docker Buildx 설치
        uses: docker/setup-buildx-action@v3

      - name: 레지스트리 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 소유자 이름 소문자 변환
        run: |
          echo "OWNER_LC=${OWNER,,}" >> "${GITHUB_ENV}"
        env:
          OWNER: "${{ github.repository_owner }}"

      - name: 빌드 앤 푸시
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/${{ env.IMAGE_REPOSITORY }}:${{ needs.calculateTag.outputs.tag_name }}
            ghcr.io/${{ env.OWNER_LC }}/${{ env.IMAGE_REPOSITORY }}:latest

  deploy:
    name: Blue/Green 무중단 배포
    runs-on: ubuntu-latest
    needs: [calculateTag, buildImageAndPush]
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4

      - name: prod compose 파일 base64 인코딩
        id: compose
        run: echo "b64=$(base64 -w0 docker-compose.prod.yaml)" >> "${GITHUB_OUTPUT}"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: 인스턴스 ID 가져오기
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=${{ env.EC2_INSTANCE_TAG_NAME }}" "Name=instance-state-name,Values=running" \
            --query "Reservations[].Instances[].InstanceId" --output text)
          [[ -n "${INSTANCE_ID}" && "${INSTANCE_ID}" != "None" ]] || { echo "No running instance found"; exit 1; }
          echo "INSTANCE_ID=${INSTANCE_ID}" >> "${GITHUB_ENV}"

      - name: Parameter Store에 secret 업로드
        env:
          APPLICATION_SECRET: ${{ secrets.APPLICATION_SECRET }}
        run: |
          [[ -z "$APPLICATION_SECRET" ]] && { echo "❌ APPLICATION_SECRET이 설정되지 않았습니다."; exit 1; }
          aws ssm put-parameter \
            --region "${{ secrets.AWS_REGION }}" \
            --name "/team02/application-secret" \
            --value "$APPLICATION_SECRET" \
            --type "SecureString" \
            --overwrite
          echo "✅ Parameter Store 업로드 완료"

      - name: AWS SSM 배포
        run: |
          DEPLOY_SCRIPT=$(cat << 'SCRIPT_EOF'
            set -Eeuo pipefail

            # Parameter Store에서 시크릿 가져오기
            mkdir -p /home/ec2-user/secrets
            aws ssm get-parameter \
              --name "/team02/application-secret" \
              --with-decryption \
              --query "Parameter.Value" \
              --output text > /home/ec2-user/secrets/application-secret.yaml
            chmod 600 /home/ec2-user/secrets/application-secret.yaml
            echo "✅ Secret 파일 갱신 완료"

            # docker-compose.yaml 최신화 (레포의 docker-compose.prod.yaml을 base64로 전달)
            mkdir -p /home/ec2-user/app
            echo "${{ steps.compose.outputs.b64 }}" | base64 -d > /home/ec2-user/app/docker-compose.yaml
            echo "✅ docker-compose.yaml 최신화 완료"

            # .env 파일 생성 (application-secret.yaml에서 비밀번호 추출)
            MYSQL_PW=$(grep -A3 "prod:" /home/ec2-user/secrets/application-secret.yaml | grep "password" | head -1 | awk '{print $2}' | tr -d '"')
            REDIS_PW=$(grep -A5 "prod:" /home/ec2-user/secrets/application-secret.yaml | grep "password" | tail -1 | awk '{print $2}' | tr -d '"')
            printf "MYSQL_ROOT_PASSWORD=%s\nREDIS_PASSWORD=%s\n" "${MYSQL_PW}" "${REDIS_PW}" > /home/ec2-user/app/.env
            chmod 600 /home/ec2-user/app/.env
            echo "✅ .env 파일 생성 완료"

            # common 네트워크 없으면 생성
            docker network inspect common >/dev/null 2>&1 || docker network create common
            echo "✅ Docker 네트워크 확인"

            # 인프라 컨테이너 미실행 시 시작
            docker-compose --env-file /home/ec2-user/app/.env -f /home/ec2-user/app/docker-compose.yaml up -d mysql redis nginx kafka
            echo "✅ 인프라 컨테이너 기동 확인"

            OWNER_LC="${{ github.repository_owner }}"
            OWNER_LC="${OWNER_LC,,}"
            IMAGE_TAG="${{ needs.calculateTag.outputs.tag_name }}"
            IMAGE="ghcr.io/${OWNER_LC}/${{ env.IMAGE_REPOSITORY }}:${IMAGE_TAG}"
            SLOT1="${{ env.CONTAINER_1_NAME }}"
            SLOT2="${{ env.CONTAINER_2_NAME }}"
            PORT_IN="${{ env.CONTAINER_PORT }}"

            echo "이미지 pull: ${IMAGE}"
            docker pull "${IMAGE}"

            if docker ps --format '{{.Names}}' | grep -q "^${SLOT1}$"; then
              BLUE="${SLOT1}"
              GREEN="${SLOT2}"
            else
              BLUE="${SLOT2}"
              GREEN="${SLOT1}"
            fi
            echo "blue(현재): ${BLUE}, green(다음): ${GREEN}"

            docker rm -f "${GREEN}" >/dev/null 2>&1 || true
            APP_IMAGE="${IMAGE}" docker-compose --env-file /home/ec2-user/app/.env -f /home/ec2-user/app/docker-compose.yaml --profile prod up -d --no-deps "${GREEN}"

            echo "헬스체크 대기: ${GREEN}"
            TIMEOUT=180
            ELAPSED=8
            sleep 8

            CONTAINER_IP=$(docker inspect --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "${GREEN}")
            while (( ELAPSED < TIMEOUT )); do
              RESPONSE=$(curl -s "http://${CONTAINER_IP}:${PORT_IN}/actuator/health" || echo "")
              [[ "${RESPONSE}" == *'"status":"UP"'* ]] && { echo "${GREEN} 정상 기동"; break; }
              sleep 5
              ELAPSED=$((ELAPSED + 5))
            done
            [[ "${RESPONSE:-}" == *'"status":"UP"'* ]] || { echo "${GREEN} 헬스체크 실패"; docker logs --tail=200 "${GREEN}" || true; docker rm -f "${GREEN}" || true; exit 1; }

            sed -i "s|proxy_pass http://[^:]*:${PORT_IN};|proxy_pass http://${GREEN}:${PORT_IN};|" /home/ec2-user/nginx/conf.d/sportteam.conf
            docker exec nginx_1 nginx -s reload
            echo "Nginx 트래픽 전환 완료: ${GREEN}"

            docker-compose --env-file /home/ec2-user/app/.env -f /home/ec2-user/app/docker-compose.yaml --profile prod stop "${BLUE}" >/dev/null 2>&1 || true
            echo "이전 컨테이너 중지: ${BLUE}"

            docker image prune -f

            echo "배포 완료. 실행 중: ${GREEN}"
          SCRIPT_EOF
          )

          PARAMS=$(jq -nc --arg s "$DEPLOY_SCRIPT" '{"commands":[$s]}')

          COMMAND_ID=$(aws ssm send-command \
            --region "${{ secrets.AWS_REGION }}" \
            --instance-ids "${{ env.INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters "$PARAMS" \
            --query "Command.CommandId" \
            --output text)

          WAIT_MAX=900
          WAIT_INTERVAL=10
          WAIT_ELAPSED=0
          while (( WAIT_ELAPSED < WAIT_MAX )); do
            CMD_STATUS=$(aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${{ env.INSTANCE_ID }}" \
              --query 'Status' --output text 2>/dev/null || echo "Unknown")
            [[ "${CMD_STATUS}" == "InProgress" || "${CMD_STATUS}" == "Pending" ]] || break
            sleep ${WAIT_INTERVAL}
            WAIT_ELAPSED=$(( WAIT_ELAPSED + WAIT_INTERVAL ))
          done

          INVOCATION=$(aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${{ env.INSTANCE_ID }}")
          STATUS=$(echo "$INVOCATION" | jq -r '.Status')

          echo "===== stdout ====="
          echo "$INVOCATION" | jq -r '.StandardOutputContent'
          echo "===== stderr ====="
          echo "$INVOCATION" | jq -r '.StandardErrorContent'
          echo "=================="
          echo "Status: ${STATUS}"

          [[ "$STATUS" == "Success" ]] || exit 1

      - name: PR 작성자 조회
        id: pr_info
        if: failure()
        run: |
          PR_AUTHOR=$(gh api "repos/$GH_REPO/commits/${{ github.sha }}/pulls" --jq '.[0].user.login')
          echo "pr_author=${PR_AUTHOR:-unknown}" >> "$GITHUB_OUTPUT"

          FIRST_LINE=$(echo "$COMMIT_MSG" | head -1)
          {
            echo "commit_message<<COMMIT_MSG_EOF"
            echo "$FIRST_LINE"
            echo "COMMIT_MSG_EOF"
          } >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}

      - name: 슬랙 배포 실패 알림
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: |
            ⚠️ 배포 실패!
            *message*: ${{ steps.pr_info.outputs.commit_message }}
            *PR 작성자*: ${{ steps.pr_info.outputs.pr_author }}
          fields: repo,commit
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        if: failure()

  makeTagAndRelease:
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 태그 생성
        id: create_tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: 릴리즈 생성
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.create_tag.outputs.new_tag }}
          name: Release ${{ steps.create_tag.outputs.new_tag }}
          body: ${{ steps.create_tag.outputs.changelog }}
          draft: false
          prerelease: false
